# 2단계: chart 변형별 perception 성능. 첫 항목이 비교 기준이다.
# 그림 확인: python -m ts2img preview charts --exp perception_augment

description: perception 에서 chart 변형별 성능 비교
benchmarks:
  - tsrbench/perception
models: [qwen3-vl-4b]
modalities: [vision, text+vision]
charts:
  - tsrbench_baseline
  - {use: line_style, names: "Time Series {n}"}   # 축 이름을 질문 표기와 맞춤 (공식은 series_0)
  - {use: line_style, linewidth: 1}               # 선 굵기 (공식 2)
  - {use: line_style, linewidth: 4}
  - {use: line_style, scale: 2}                   # 해상도 2배
  - {use: tsrbench_baseline, post: [sharpen]}
  - {use: moving_average, window: 8}
  - {use: overlay_legend, normalize: zscore}      # 한 축에 색 + legend
  - {use: multi_view, views: [full, smooth, diff]}
sampling: official
repeats: 1
