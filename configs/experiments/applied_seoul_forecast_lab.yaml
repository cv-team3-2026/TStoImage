# 따릉이 다음 날 수준. 대형 VLM 비교용. text / vision / text+vision.

description: >
  서울 공공자전거만. 직전 4주(672시간)로 다음 24시간 평균의 다섯 단계.
  차트는 line_style scale 3. 90문항.
  text, vision, text+vision 을 같은 문항으로 비교한다.
  모델은 lab-vlm (다른 서버의 대형 VLM). secrets.env 의 LAB_VLM_* 를 맞춘다.

benchmarks:
  - applied_seoul
models: [lab-vlm]
modalities: [text, vision, text+vision]
charts:
  - {use: line_style, scale: 3}
sampling: official
repeats: 1
